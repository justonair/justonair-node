name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Package loads as ESM and CommonJS
        run: |
          node -e "const { JustOnAir } = require('./dist/index.cjs'); new JustOnAir({ apiKey: 'x' })"
          node --input-type=module -e "import JustOnAir from './dist/index.js'; new JustOnAir({ apiKey: 'x' })"
