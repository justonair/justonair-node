name: Publish
# Push a tag v<version> (matching package.json) to publish to npm.
on:
  push:
    tags: ['v*']

# No npm token: npm trusts this workflow directly (Trusted Publisher on
# npmjs.com: org justonair, repo justonair-node, workflow publish.yml).
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # trusted publishing needs npm 11.5.1+
      - name: Tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm ci
      - run: npm run typecheck && npm test && npm run build
      - run: npm publish --access public
